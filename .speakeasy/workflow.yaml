workflowVersion: 1.0.0
speakeasyVersion: 1.796.4
sources:
    continuous-simulation:
        inputs:
            - location: registry.speakeasyapi.dev/continuous/continuous/continuous-simulation@main
        output: .speakeasy/out.openapi.yaml
targets:
    continuous-python:
        target: python
        source: continuous-simulation
        publish:
            pypi:
                useTrustedPublishing: true
        codeSamples:
            registry:
                location: registry.speakeasyapi.dev/continuous/continuous/continuous-python-code-samples
            blocking: false
