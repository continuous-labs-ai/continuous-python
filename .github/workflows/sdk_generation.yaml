name: Generate

on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
    inputs:
      force:
        description: Force generation even when the source is unchanged
        type: boolean
        default: false
      set_version:
        description: Optionally set a specific SDK version
        type: string

permissions:
  checks: write
  contents: write
  pull-requests: write
  statuses: write
  id-token: write

jobs:
  generate:
    uses: speakeasy-api/sdk-generation-action/.github/workflows/workflow-executor.yaml@68f3bfefb79354d39358bf4699863dabd2cea0f6
    with:
      mode: pr
      target: continuous-python
      force: ${{ inputs.force == true && 'true' || 'false' }}
      set_version: ${{ inputs.set_version }}
      skip_testing: true
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      pr_creation_pat: ${{ secrets.SPEAKEASY_GITHUB_TOKEN }}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}

  slack-alert:
    name: Slack alert
    needs: [generate]
    if: (failure() || cancelled()) && contains(fromJSON('["push", "schedule", "workflow_run", "repository_dispatch", "release"]'), github.event_name)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts
      - run: .github/workflows/scripts/slack-alert.sh
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
